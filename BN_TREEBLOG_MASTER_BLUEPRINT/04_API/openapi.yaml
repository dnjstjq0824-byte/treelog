openapi: 3.1.0
info:
  title: TreeBlog Global Independent Blog Platform API
  version: 1.0.0
  description: BN-TREEBLOG-GEMINI4-ARGON-MASTER-BLUEPRINT-001 전체 24개 API 그룹 106개 핵심 엔드포인트 OpenAPI 3.1.0 공식 명세서. 독립 구동 우선 및
    향후 TreeScan 통합 인터페이스를 포함한다.
  contact:
    name: Booking Network Platform Architecture Team
  license:
    name: Proprietary - Booking Network
servers:
- url: https://api.treeblog.example.com
  description: Production API Server (Configurable via env)
- url: http://localhost:8080
  description: Local Docker Compose Development Server
tags:
- name: Authentication
  description: '[G01] 회원가입, 로그인, 토큰 갱신, 비밀번호 복구, OAuth/OIDC, MFA'
- name: User
  description: '[G02] 내 프로필 조회/수정, 환경설정, 세션 기기 관리, 동의 내역, 계정 탈퇴'
- name: Blog Creation
  description: '[G03] 블로그 개설, 핸들 중복/예약어 실시간 검증, 내 소속 블로그 목록'
- name: Blog Management
  description: '[G04] 블로그 정보/설정 변경, 팀 멤버 초대/권한 변경, 네비게이션, 소유권 이전, 블로그 폐쇄'
- name: Post Editor
  description: '[G05] 초안 생성, 듀얼 자동저장(Optimistic Lock), 리비전 목록/Diff 복원, 링크 OG 프리뷰, 마크다운 변환'
- name: Post Publishing
  description: '[G06] 즉시 발행, 예약 발행 등록/취소, 공개 범위 변경, 발행 취소, 휴지통 이동/복원/영구삭제, 공개 열람'
- name: Media
  description: '[G07] S3 Presigned 업로드 세션 발급/완료, 이미지 파생본/대체텍스트 관리, 외부 동영상 안전 임베드'
- name: Category & Tags
  description: '[G08] 2뎁스 카테고리 CRUD/순서변경, 시리즈(연재물) 관리, 태그 자동완성 및 인기 태그'
- name: Follow & Subscription
  description: '[G09] 팔로우, 이웃 추가, 상호이웃(서로이웃) 신청/수락/거절, 이웃 그룹 관리, 알림/뉴스레터 구독'
- name: Comments
  description: '[G10] 2뎁스 댓글/대댓글 작성/수정/삭제, 비밀댓글, 댓글 승인/고정, 방명록 CRUD'
- name: Reactions
  description: '[G11] 게시글 6종 공감 리액션 토글 및 공감자 목록, 댓글 좋아요 토글'
- name: Bookmarks
  description: '[G12] 게시글 북마크 저장/해제, 폴더별 북마크 목록, 읽기 진행률 동기화'
- name: Notifications
  description: '[G13] 인앱 알림 목록, 미확인 카운트, SSE 실시간 스트림, 일괄 읽음, 채널별 수신 설정, Web Push 등록'
- name: Search
  description: '[G14] 통합/블로그별 게시글 검색, 블로그 검색, 태그 검색, 검색어 자동완성, 검색 클릭 비콘'
- name: Recommendations
  description: '[G15] 구독/이웃 새 글 피드, 개인화 추천 피드, 실시간/일간/주간 인기 게시글, 인기 블로그, 관련 글, 피드백'
- name: Analytics
  description: '[G16] 열람/완독 비콘 수집, 방문자/페이지뷰 개요, 게시글별 성과, 유입 경로/검색어, 독자 분포, 크롤러 통계'
- name: Custom Domains
  description: '[G17] 서브도메인/개인 도메인 등록, DNS TXT/CNAME 소유권 검증, 대표 Canonical 도메인 지정, 내부 호스트 리졸브'
- name: Themes
  description: '[G18] 공식 테마 카탈로그 조회, 블로그 테마 적용/토큰 커스터마이징/안전 CSS 저장, 기본값 원클릭 복원'
- name: Advertising
  description: '[G19] 광고주 계정/캠페인/소재 등록, 문맥 타기팅 광고 송출, 노출/클릭 비콘, 블로그 광고 슬롯 설정'
- name: Membership & Payments
  description: '[G20] 유료 멤버십 플랜 관리, 단건 유료글 구매, 독자 후원, PG 결제 웹훅, 복식부기 원장 및 정산 출금 신청'
- name: Moderation
  description: '[G21] 콘텐츠/블로그/댓글/저작권 신고 접수, 내 제재 내역 조회 및 이의신청(Appeal) 제출, 사용자 차단'
- name: Admin
  description: '[G22] 회원/블로그/게시글/댓글/모더레이션/검색/광고심사/정산승인/시스템설정/기능플래그/감사로그 통합 관리'
- name: Import / Export
  description: '[G23] 블로그 전체 백업 내보내기(Markdown/HTML/WXR ZIP), 외부 블로그 가져오기 및 오류 리포트, RSS/Atom 피드'
- name: TreeScan Integration
  description: '[G24] TreeScan 증분 공개 색인 동기화 피드, 자매 플랫폼 디스커버리 API, OIDC 통합 계정 매핑, 연동 헬스체크'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token (RS256/EdDSA JWT, 15m TTL)
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: tb_refresh_token
      description: HttpOnly Secure SameSite=Lax Refresh Token Cookie
    ServiceHMACAuth:
      type: apiKey
      in: header
      name: X-TreeBlog-Service-Signature
      description: HMAC-SHA256 / mTLS Service-to-Service Authentication for TreeScan & PG Webhooks
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: 멱등성 보장 키 (결제, 정산, 발행, 생성 요청의 중복 실행 방지)
    CursorQueryParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Keyset(Cursor) 페이지네이션 불투명 커서 토큰
    LimitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 페이지당 반환 항목 수 (최대 100)
  schemas:
    StandardErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - timestamp
          properties:
            code:
              type: string
              example: FORBIDDEN_MUTUAL_ONLY
            message:
              type: string
              example: 상호이웃에게만 공개된 게시글입니다.
            request_id:
              type: string
              example: req_018f2a107b11
            timestamp:
              type: string
              format: date-time
            details:
              type: array
              items:
                type: object
    CursorPageMeta:
      type: object
      required:
      - has_next
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_next:
          type: boolean
        total_estimate:
          type: integer
    GenericSuccessResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
        request_id:
          type: string
paths:
  /api/v1/auth/register:
    post:
      operationId: ep_auth_001
      tags:
      - Authentication
      summary: '[EP-AUTH-001] 이메일 신규 회원가입'
      description: '- **Authentication**: `PUBLIC`

        - **Authorization (RBAC)**: `ANON`

        - **Rate Limit**: `10/hour/IP`

        - **Idempotency**: `Required/Supported`

        - **Audit Policy**: `AUDIT_LOG_MANDATORY`

        - **Pagination**: `NONE`

        - **Verification Test ID**: `TEST-USR-001`'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        default:
          description: '표준 오류 응답 (가능한 상태 코드: 400,409,422,429)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: EP-AUTH-001 요청 페이로드 스키마 (상세 필드 제약은 API_CONTRACT.md 참조)
